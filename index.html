<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="내 주변에서 무료로 잠깐 쉴 수 있는 벤치와 쉼터를 찾아보세요.">
  <meta name="theme-color" content="#197c68">
  <title>쉬엄쉬엄 - 무료 휴식공간 찾기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css?v=local-font-preview-2">
  <link rel="stylesheet" href="css/park-map-markers.css?v=small-pins-3">
  <link rel="stylesheet" href="css/ui-polish.css?v=compact-attribution-2">
  <link rel="stylesheet" href="css/place-selection.css?v=transparent-pin-selection-1">
  <link rel="stylesheet" href="css/map-first.css?v=full-list-25">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/app-icon-32.png?v=mascot-1">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/app-icon-180.png?v=mascot-1">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body class="map-first">
  <header class="header">
    <a class="brand-home" href="/" aria-label="쉬엄쉬엄 메인으로">
    <img class="brand-logo" src="images/app-icon-192.png?v=mascot-1" alt="" aria-hidden="true">
    <div>
      <h1 class="app-title">쉬엄쉬엄</h1>
      <p class="app-subtitle">주변 무료 휴식공간 찾기</p>
    </div>
    </a>
  </header>

  <section class="location-section" aria-label="위치 설정">
    <button type="button" class="btn btn-primary" id="btnCurrentLocation"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg></span> 현재 위치</button>
    <div class="search-box-wrapper">
      <form class="search-form" id="searchForm">
        <label class="sr-only" for="searchInput">주소 또는 장소 검색</label>
        <input type="search" class="search-input" id="searchInput" placeholder="어디 근처에서 쉬고 싶나요?" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="searchSuggestions">
        <button type="submit" class="btn btn-search" id="btnSearch">검색</button>
      </form>
      <div class="search-suggestions" id="searchSuggestions" role="listbox" hidden></div>
    </div>
    <p class="location-hint" id="locationHint">지도를 보며 현재 위치를 확인하고 있어요.</p>
  </section>

  <main class="main-content" id="mainContent">
    <nav class="view-tabs" role="tablist" aria-label="결과 보기">
      <button type="button" class="tab-btn active" id="tabMap" role="tab" aria-selected="true">지도</button>
      <button type="button" class="tab-btn" id="tabList" role="tab" aria-selected="false">목록 <span id="tabCount"></span></button>
    </nav>
    <section class="map-panel active" id="mapPanel" aria-label="휴식공간 지도">
      <div id="map" class="map-container" role="application" aria-label="OpenStreetMap 지도"></div>
      <div class="map-marker-legend" aria-label="지도 마커 범례">
        <span><i class="legend-dot legend-user" aria-hidden="true"></i>현재 위치</span>
        <span><i class="legend-dot legend-place" aria-hidden="true"></i>휴식공간</span>
      </div>
      <button type="button" class="btn btn-map-control" id="btnRecenter" aria-label="검색 위치로 지도 이동" title="검색 위치로">◎</button>
      <button type="button" class="btn btn-follow-navigation" id="btnFollowNavigation" aria-label="현재 위치 따라가기" aria-pressed="true">위치 따라가는 중</button>
      <button type="button" class="btn btn-user-location" id="btnUserLocation" aria-label="내 위치 보기" title="내 위치">📍</button>
    </section>
    <section class="list-panel" id="listPanel" aria-label="주변 휴식공간 목록" hidden>
      <button type="button" class="list-drag-handle" aria-label="목록 크기 변경" title="위아래로 끌어 목록 크기 변경"><span></span></button>
      <div class="list-scroll-content">
      <div class="results-header">
        <div><p class="eyebrow">주변에서 찾았어요</p><h2 class="results-count" id="resultsCount">휴식공간 0곳</h2></div>
        <span class="sort-label">가까운순</span>
      </div>
      <div class="places-list" id="placesList" role="list"></div>
      <div class="expand-search-container" id="expandSearchContainer" hidden>
        <button type="button" class="btn btn-expand-search" id="btnExpandSearch">
          <span class="expand-icon" aria-hidden="true">🔍</span>
          <span id="expandSearchText">더 넓게 검색 (반경 2km)</span>
        </button>
      </div>
      <div class="empty-state" id="emptyState" hidden><div class="empty-icon" aria-hidden="true">⌖</div><h3>주변에서 장소를 찾지 못했어요</h3><p>다른 위치를 검색하거나 '더 넓게 검색'을 눌러보세요.</p></div>
      <p class="distance-note">도보 거리와 시간은 실제 상황에 따라 달라질 수 있어요.</p>
      </div>
    </section>
  </main>

  <div class="loading-overlay" id="loadingOverlay" hidden role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><p id="loadingText">주변 휴식공간을 찾는 중...</p></div>
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header"><div><p class="eyebrow">목적지</p><h2 class="sheet-title" id="sheetTitle">휴식공간</h2></div><button type="button" class="btn-close" id="btnCloseSheet" aria-label="상세 정보 닫기">×</button></header>
    <section class="nav-panel" id="navPanel" aria-label="도보 길안내" hidden>
      <p class="nav-kicker">도보 길찾기</p><p class="nav-instruction" id="navInstruction">경로를 불러오는 중...</p><p class="nav-distance" id="navDistance"></p><p class="nav-remaining" id="navRemaining"></p><p class="nav-status" id="navStatus" aria-live="polite"></p>
      <div class="nav-actions"><button type="button" class="btn btn-nav-preview" id="btnPreviewRoute" hidden>검색 경로로 돌아가기</button><button type="button" class="btn btn-nav-search-start" id="btnSearchRouteStart" hidden>선택한 위치에서 경로 보기</button><button type="button" class="btn btn-nav-start" id="btnStartNavigation" hidden>현재 위치에서 실시간 안내</button><button type="button" class="btn btn-nav-stop" id="btnStopNavigation" hidden>안내 종료</button><button type="button" class="btn btn-nav-retry" id="btnRecalculateRoute" hidden>경로 다시 찾기</button></div>
    </section>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <footer class="footer"><p>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> · <a href="https://tmapmobility.com/" target="_blank" rel="noopener noreferrer">TMAP</a></p><p class="disclaimer">의자 상태와 이용 가능 여부는 현장에서 확인해 주세요.</p></footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/user-heading.js?v=heading-1"></script>
  <script src="js/data.js?v=area-search-18"></script>
  <script src="js/place-classification.js?v=bus-seating-6"></script>
  <script src="js/overpass.js?v=all-bus-stops-6"></script>
  <script src="js/public-data.js?v=progressive-search-20261012e"></script>
  <script src="js/route-candidate-preservation.js?v=preserve-candidates-2"></script>
  <script src="js/overpass-preview.js?v=partial-search-status-2"></script>
  <script src="js/app.js?v=free-drag-22"></script>
  <script src="js/search-route-origin.js?v=local-fix-20261012"></script>
  <script src="js/navigation-guidance.js?v=white-navigation-8"></script>
  <script src="js/park-results-ui.js?v=bus-seating-6"></script>
  <script src="js/park-map-markers.js?v=small-pins-3"></script>
  <script src="js/place-selection.js?v=focus-place-15"></script>
  <script src="js/navigation-modes.js?v=map-navigation-20261012b"></script>
  <script src="js/sheet-gestures.js?v=unified-panel-14"></script>
  <script src="js/scroll-header.js?v=wide-drag-23"></script>
  <script src="js/list-sheet.js?v=full-list-25"></script>
  <script src="js/unified-place-panel.js?v=free-drag-22"></script>
  <script src="js/panel-history.js?v=1"></script>
  <script src="js/home-location.js?v=1"></script>
  <script src="js/nearby-cache.js?v=1"></script>
</body>
</html>
